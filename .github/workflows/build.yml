name: Build HardKeyFix .deb

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Download iOS SDK
        run: |
          mkdir -p $HOME/theos/sdks
          curl -L "https://github.com/theos/sdks/archive/refs/heads/master.zip" -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp/sdks_out
          mv /tmp/sdks_out/sdks-master/* $HOME/theos/sdks/

      - name: Download ldid (Procursus build)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev libplist-dev libssl3
          curl -sL "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64" -o $HOME/theos/bin/ldid
          chmod +x $HOME/theos/bin/ldid
          ldid || true

      - name: Build .deb
        run: |
          export THEOS="$HOME/theos"
          make package FINALPACKAGE=1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: HardKeyFix-deb
          path: packages/*.deb
